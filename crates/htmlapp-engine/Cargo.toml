[package]
name = "htmlapp-engine"
description = "The WebEngine abstraction and its backends for HTML App"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["wry-backend"]
# The backend that ships today: wry, embedded as a child surface in the GPUI window.
wry-backend = ["dep:wry", "dep:gtk", "dep:webkit2gtk-sys", "dep:raw-window-handle", "dep:x11rb"]
# PRD §6.2 target backend. Requires libwpe + wpewebkit-2.0, which is not yet packaged on most
# distributions (§16 R3), so it is opt-in and compiled only where those libraries exist.
wpe-backend = []
# Exposes the engine inspector. Off by default: a document should not ship with devtools
# reachable unless its author asked for it.
devtools = ["wry?/devtools"]
# PRD §8.3 `mode: "layer"` and `mode: "lock"`: bars, docks, widgets, and overlays.
#
# Off by default because it needs a system library that is not installed everywhere:
#     sudo apt install libgtk-layer-shell-dev     # Debian/Ubuntu
#     sudo dnf install gtk-layer-shell-devel      # Fedora
#     sudo pacman -S gtk-layer-shell              # Arch
# Build with `--features htmlapp-engine/layer-shell` once it is present.
layer-shell = ["dep:gtk-layer-shell", "wry-backend"]

[dependencies]
htmlapp-caps.workspace = true
htmlapp-bridge.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
dirs.workspace = true
parking_lot.workspace = true

wry = { version = "0.57", optional = true }
gtk = { version = "0.18", optional = true }
# Pinned to the same gtk-rs generation wry uses; a mismatch would mean two incompatible GTKs.
#
# `v0_6` is not about the crate version but the system library's: the bindings gate each entry point
# behind the release that introduced it, and this backend calls two gated ones — `is_supported`
# (library 0.5) and `set_keyboard_mode` (0.6). Without the feature they are compiled out and the
# build fails with "not found in `gtk_layer_shell`". 0.6 is from 2021; anything new enough to have
# webkit2gtk-4.1 has it.
gtk-layer-shell = { version = "0.8", optional = true, features = ["v0_6"] }
webkit2gtk-sys = { version = "2.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
x11rb = { version = "0.13", optional = true, features = ["shape"] }

[dev-dependencies]
tempfile = "3"
htmlapp-bridge.workspace = true
sha2.workspace = true
base64.workspace = true
