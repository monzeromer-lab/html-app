# Install every system library the workspace links against.
#
# GitHub runners ship almost none of these, so every job that compiles Rust needs this first.
#
# The list lives here rather than being repeated in each job: it was duplicated across four jobs
# before, and a package missing from one copy is a build that fails several minutes in with a
# pkg-config error that names a `.pc` file rather than a package.
#
# Each entry is the package that owns the `.pc` file a `-sys` crate probes for. To re-derive the
# list after adding a dependency:
#
#     cargo tree --workspace --edges normal,build --prefix none | grep -oE '^[a-z0-9_-]+-sys'
#     pkg-config --variable=pcfiledir <name>     # then: dpkg -S <dir>/<name>.pc
name: Install Linux build dependencies
description: apt-get the system libraries htmlapp links against

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          pkg-config \
          libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          libgtk-3-dev \
          libudev-dev \
          libx11-dev \
          libxkbcommon-dev \
          libwayland-dev \
          libfontconfig1-dev \
          libfreetype-dev \
          libvulkan-dev \
          libssl-dev \
          libgtk-layer-shell-dev

    - shell: bash
      # Fail here, with the name of what is missing, rather than several minutes into a compile.
      run: |
        set -euo pipefail
        missing=()
        for pc in libudev fontconfig freetype2 x11 wayland-client xkbcommon \
                  webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0 gtk+-3.0 \
                  vulkan openssl gtk-layer-shell-0; do
          pkg-config --exists "$pc" || missing+=("$pc")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::missing pkg-config packages: ${missing[*]}"
          exit 1
        fi
        echo "all required pkg-config packages are present"
